schema_version = "1.4"
artifacts = ["/app/policy.py"]

[task]
name = "research/warehouse-calibration"

[metadata]
category = "science-and-engineering"
difficulty_explanation = "Identify load-dependent traction from limited measurements and predict motion after different command histories."

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 600.0
network_mode = "no-network"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]

[verifier]
environment_mode = "separate"
timeout_sec = 240.0
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 600.0
network_mode = "no-network"
