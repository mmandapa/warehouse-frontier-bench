schema_version = "1.4"
artifacts = ["/app/submission/folds.json", "/app/submission/audit.json", "/app/submission/report.md"]

[task]
name = "research-reliability/unseen-subject-audit"

[metadata]
category = "ml-autoresearch"
difficulty_explanation = "Reproduce and audit a classifier claim under a deployment-relevant protocol; empirical frontier difficulty is unestablished."

[agent]
timeout_sec = 1200.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 600.0
network_mode = "no-network"

[verifier]
environment_mode = "separate"
timeout_sec = 300.0
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 600.0
