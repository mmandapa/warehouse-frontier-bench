schema_version = "1.4"
artifacts = ["/app/policy.py"]

[task]
name = "research/warehouse-calibration"
version = "1.0.0"

[metadata]
category = "science-and-engineering"
difficulty_explanation = "Use limited experiments to identify the motion of a serviced cart and forecast commands outside the calibration sequence."

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 600.0
network_mode = "no-network"

[agent]
timeout_sec = 900.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]

[verifier]
environment_mode = "separate"
timeout_sec = 240.0
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 600.0
network_mode = "no-network"
