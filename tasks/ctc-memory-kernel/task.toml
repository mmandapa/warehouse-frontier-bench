schema_version = "1.4"
artifacts = ["/app/submission/kernel.wasm"]

[task]
name = "research-reliability/ctc-memory-kernel"

[metadata]
category = "ml-autoresearch"
difficulty_explanation = "Preserve exact CTC loss and logit gradients while replacing a dense dynamic-programming table under a strict memory and work budget; empirical model difficulty requires frozen-version trials."

[agent]
timeout_sec = 1200.0
network_mode = "allowlist"
allowed_hosts = ["api.openai.com"]

[environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 600.0
network_mode = "no-network"

[verifier]
environment_mode = "separate"
timeout_sec = 300.0
network_mode = "no-network"

[verifier.environment]
cpus = 2
memory_mb = 4096
storage_mb = 4096
build_timeout_sec = 600.0
